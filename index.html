<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101610"><meta name="apple-mobile-web-app-capable" content="yes"><title>Brain Dump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#090b09;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.stage{position:relative;width:min(100vw,430px);aspect-ratio:851/1685;margin:auto;background:url("approved-home.png") top center/100% 100% no-repeat;overflow:hidden}
textarea{position:absolute;left:6.8%;top:35.8%;width:86.8%;height:13.2%;border:0;background:transparent;border-radius:17px;padding:13px 14px;color:transparent;caret-color:#31261f;font:15px/1.45 inherit;resize:none;outline:none}
#speak,#dumpBtn{position:absolute;top:50.45%;height:5.1%;border:0;background:transparent;color:transparent}
#speak{left:7%;width:35%}#dumpBtn{left:45%;width:48%}
#recent{display:none!important;position:absolute;left:4.8%;top:64.3%;width:90.5%;height:8.3%;display:grid;grid-template-columns:52px 1fr 36px;gap:10px;align-items:center;padding:8px 12px;color:#f4e8d0;background:rgba(20,29,22,.96);border:1px solid #766b4c;border-radius:18px}
#recent.empty{display:none}.ico{width:46px;height:46px;border:1px solid #887a55;border-radius:13px;display:grid;place-items:center;font-size:22px}.title{font:600 16px Georgia,serif}.meta{font-size:10px;letter-spacing:.09em;color:#bdb09c;margin-top:5px;text-transform:uppercase}.check{appearance:none;width:25px;height:25px;border:1.5px solid #d9c8ad;border-radius:50%}.check:checked{background:#9d4c2d;box-shadow:inset 0 0 0 5px #182019}
.count{position:absolute;right:7%;top:61.5%;color:#f4e8d0;font:13px Georgia,serif}
nav button{position:absolute;bottom:5.2%;height:6%;border:0;background:transparent;color:transparent}#home{left:5%;width:21%}#today{left:27%;width:21%}#cats{left:49%;width:24%}#search{left:74%;width:21%}
.sorting{position:fixed;inset:0;z-index:20;background:#111a14;color:#f4e8d0;display:none;place-items:center;text-align:center}.sorting.show{display:grid}.sorting h2{font:32px Georgia,serif;margin:14px}.sorting div div{font-size:50px}.sorting p{font:14px Georgia,serif;opacity:.75}
.toast{position:fixed;z-index:30;top:30px;left:50%;transform:translateX(-50%);background:#17231c;color:#fff;padding:10px 14px;border-radius:99px;display:none;font-size:13px}
@media(max-width:360px){textarea{font-size:13px}}
</style></head><body>
<main class="stage"><textarea id="dump" maxlength="1000" placeholder="Dump absolutely anything..."></textarea>
<button id="speak" aria-label="Speak">Speak</button><button id="dumpBtn" aria-label="Dump it">Dump it</button><div class="count" id="count" style="display:none"></div>
<section id="recent" class="empty"></section>
<nav><button id="home">Home</button><button id="today">Today</button><button id="cats">Categories</button><button id="search">Search</button></nav></main>
<div class="sorting" id="sorting"><div><div>☾ ✦</div><h2>sorting<br>the chaos…</h2><p>Breaking it down, finding the right homes<br>and making sense of the madness.</p></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),KEY='brain-dump-v1';let thoughts=JSON.parse(localStorage.getItem(KEY)||'[]');
const cats=[['Mischievous Melts',/wax|melt|scent|fragrance|clp|mould|mold|shopify|etsy/i,'✦'],['Oscar',/oscar|dog|flea|treat/i,'🐾'],['Shopping',/buy|order|pick up|shopping|need more|get some/i,'⌑'],['Home & DIY',/paint|cabinet|trim|wall|shelf|radiator|wood|diy|room|garden|sand|drill/i,'⌂'],['Learning / Research',/look into|research|course|find out|learn/i,'⌕'],['Life Admin',/book|appointment|email|call|pay|renew|form/i,'☷'],['Personal',/mam|gary|birthday|card|personal/i,'♡'],['Ideas',/idea|maybe|could|what if/i,'☼']];
function classify(t){for(const[name,re,icon]of cats)if(re.test(t))return{name,icon};return{name:'Inbox',icon:'☾'}}
function splitDump(t){return t.replace(/\n+/g,'. ').split(/(?:[.!?]+\s+|;\s*|,\s+(?=(?:need|order|remember|idea|look|buy|call|email|finish|make|find)\b))/i).map(x=>x.trim().replace(/[.!?]+$/,'')).filter(x=>x.length>2)}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(thoughts));render()}
function render(){let x=thoughts[thoughts.length-1];$('#count').textContent=`${$('#dump').value.length}/1000`;if(!x){$('#recent').className='empty';$('#recent').innerHTML='';return}$('#recent').className='';$('#recent').innerHTML=`<div class="ico">${x.icon}</div><div><div class="title">${esc(x.text)}</div><div class="meta">${x.category} · ${new Date(x.created).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></div><input class="check" type="checkbox" ${x.done?'checked':''}>`;$('.check').onchange=e=>{x.done=e.target.checked;save()}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1600)}
$('#dump').oninput=()=>$('#count').textContent=`${$('#dump').value.length}/1000`;
$('#dumpBtn').onclick=()=>{let raw=$('#dump').value.trim();if(!raw)return toast('Give me some chaos first 😂');$('#sorting').classList.add('show');setTimeout(()=>{splitDump(raw).forEach(text=>{let c=classify(text);thoughts.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()+'',text,category:c.name,icon:c.icon,created:Date.now(),done:false})});save();$('#dump').value='';$('#sorting').classList.remove('show')},850)};
$('#speak').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice capture needs Safari support');let r=new SR();r.lang='en-GB';r.onresult=e=>{$('#dump').value+=($('#dump').value?' ':'')+e.results[0][0].transcript};r.start()};

function closeScreens(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'))}
document.querySelectorAll('.back').forEach(b=>b.onclick=closeScreens);
$('#home').onclick=closeScreens;
$('#today').onclick=()=>{closeScreens();let box=$('#todayList');box.innerHTML=thoughts.length?thoughts.slice().reverse().map(t=>`<div class="item"><b>${esc(t.text)}</b><small>${t.category}</small></div>`).join(''):'<div class="item">Nothing dumped yet.</div>';$('#todayScreen').classList.add('show')};
$('#cats').onclick=()=>{closeScreens();let groups={};thoughts.forEach(t=>(groups[t.category]??=[]).push(t));$('#catList').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([c,a])=>`<div class="item"><b>${esc(c)}</b><small>${a.length} thought${a.length===1?'':'s'}</small></div>`).join(''):'<div class="item">Your categories will appear here.</div>';$('#catsScreen').classList.add('show')};
$('#search').onclick=()=>{closeScreens();$('#searchScreen').classList.add('show');$('#searchBox').focus()};
$('#searchBox').oninput=e=>{let q=e.target.value.toLowerCase();let a=q?thoughts.filter(t=>t.text.toLowerCase().includes(q)||t.category.toLowerCase().includes(q)):[];$('#searchList').innerHTML=a.map(t=>`<div class="item"><b>${esc(t.text)}</b><small>${t.category}</small></div>`).join('')};
render();

</script>

<script>
function updateThoughtCount(){
 const n=thoughts.length, el=document.getElementById('liveThoughtCount');
 if(el) el.textContent=`${n} thought${n===1?'':'s'}`;
}
const _renderFinal=render;
render=function(){_renderFinal();updateThoughtCount()}
