<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brain Dump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090c09;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{position:relative;width:min(100vw,430px);aspect-ratio:851/1685;margin:auto;background:url("approved-home.png") top center/100% 100% no-repeat;overflow:hidden}
#dump{position:absolute;left:6.7%;top:33.1%;width:87%;height:14.3%;z-index:5;border:1px solid #d5c3ac;border-radius:18px;background:rgba(245,234,217,.96);padding:18px 20px 34px;color:#31261f;font:15px/1.45 inherit;resize:none;outline:none}
#dump::placeholder{color:#aaa39c}.counter{position:absolute;right:9.3%;top:45.25%;z-index:6;color:#342b25;font-size:12px}
.hit{position:absolute;z-index:7;border:0;background:transparent;color:transparent}
#speak{left:7%;top:48.7%;width:35%;height:5.1%}#dumpBtn{left:45%;top:48.7%;width:48%;height:5.1%}
#dynamicCard{position:absolute;left:4.8%;top:64.0%;width:90.4%;height:8.7%;z-index:8;display:grid;grid-template-columns:48px 1fr 32px;gap:11px;align-items:center;padding:10px 13px;border:1px solid #746e50;border-radius:18px;background:#171d16;color:#f4e8d0}
#dynamicCard.hidden{display:none}.moon{width:45px;height:45px;border:1px solid #817655;border-radius:13px;display:grid;place-items:center;font-size:22px}.thoughtTitle{font:600 16px Georgia,serif}.meta{margin-top:4px;font-size:10px;letter-spacing:.08em;color:#bdb09c;text-transform:uppercase}.done{appearance:none;width:25px;height:25px;border:1.5px solid #d9c8ad;border-radius:50%}.done:checked{background:#9d4c2d;box-shadow:inset 0 0 0 5px #171d16}
nav button{position:absolute;bottom:3.7%;height:6%;z-index:9;border:0;background:transparent;color:transparent}#home{left:5%;width:21%}#today{left:27%;width:21%}#cats{left:49%;width:24%}#search{left:74%;width:21%}
.screen{position:absolute;inset:0;z-index:20;display:none;overflow:auto;padding:44px 22px calc(100px + env(safe-area-inset-bottom));background:#0f1611;color:#f5ead6}.screen.show{display:block}.screen h1{font:42px Georgia,serif;margin:22px 0 5px}.screen .sub{opacity:.7;margin-bottom:24px}.back{border:1px solid #716b50;background:#1a2119;color:#f5ead6;border-radius:999px;padding:10px 14px}.item{border:1px solid #625f47;background:#171d16;border-radius:18px;padding:15px;margin:10px 0}.item b{font:17px Georgia,serif}.item small{display:block;opacity:.65;margin-top:5px;text-transform:uppercase;letter-spacing:.07em}#searchBox{width:100%;padding:14px;border:1px solid #756d53;border-radius:15px;background:#f6eddd;color:#2f2822;font-size:16px}
.sorting{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;background:#111a14;color:#f4e8d0}.sorting.show{display:grid}.sorting .moonbig{font-size:52px}.sorting h2{font:34px Georgia,serif;margin:12px}.sorting p{font:14px Georgia,serif;opacity:.72}.toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;z-index:40;display:none;transform:translateX(-50%);white-space:nowrap;padding:10px 14px;border-radius:99px;background:#17231c;color:white;font-size:13px}
</style></head><body>
<main class="app">
<textarea id="dump" maxlength="1000" placeholder="Dump absolutely anything..."></textarea><div class="counter" id="counter">0/1000</div>
<button class="hit" id="speak" aria-label="Speak">Speak</button><button class="hit" id="dumpBtn" aria-label="Dump it">Dump it</button>
<section id="dynamicCard" class="hidden"></section>
<nav><button id="home">Home</button><button id="today">Today</button><button id="cats">Categories</button><button id="search">Search</button></nav>
<section class="screen" id="todayScreen"><button class="back">← Home</button><h1>today</h1><div class="sub">The bits your brain needs today.</div><div id="todayList"></div></section>
<section class="screen" id="catsScreen"><button class="back">← Home</button><h1>categories</h1><div class="sub">Your chaos, with homes.</div><div id="catList"></div></section>
<section class="screen" id="searchScreen"><button class="back">← Home</button><h1>search</h1><div class="sub">Find something you dumped.</div><input id="searchBox" placeholder="Search your brain…"><div id="searchList"></div></section>
</main>
<div class="sorting" id="sorting"><div><div class="moonbig">☾ ✦</div><h2>sorting<br>the chaos…</h2><p>Breaking it down and finding the right homes.</p></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), KEY='brain-dump-v1';
let thoughts=JSON.parse(localStorage.getItem(KEY)||'[]');
const rules=[['Mischievous Melts',/wax|melt|scent|fragrance|clp|mould|mold|shopify|etsy|oil|label|stock/i],['Oscar',/oscar|dog|flea|treat|vet/i],['Shopping',/buy|order|pick up|shopping|need more|get some|shopping list/i],['Home & DIY',/paint|cabinet|trim|wall|shelf|radiator|wood|diy|room|garden|sand|drill|wallpaper|filler|caulk/i],['Learning / Research',/look into|research|course|find out|learn|compare|check/i],['Life Admin',/book|appointment|email|call|pay|renew|form|fit note|post|parcel/i],['Personal',/mam|gary|birthday|card|personal/i],['Ideas',/idea|maybe|could|what if|thinking of/i]];
function cat(t){for(const [n,r] of rules)if(r.test(t))return n;return'Inbox'}
function kind(t){
 if(/\b(buy|order|get|pick up|shopping|need more)\b/i.test(t))return'Shopping';
 if(/\b(remind|remember|don't forget|tomorrow|today|tonight|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.test(t))return'Reminder';
 if(/\b(idea|maybe|could|what if|thinking of)\b/i.test(t))return'Idea';
 if(/\b(call|email|book|pay|clean|paint|make|finish|sort|send|print|label|photograph|do|fix|find)\b/i.test(t))return'Task';
 return'Note'
}
function when(t){
 const s=t.toLowerCase(),d=new Date(),out=new Date(d);
 if(/\btomorrow\b/.test(s)){out.setDate(d.getDate()+1);return out.toISOString()}
 if(/\btoday\b|\btonight\b/.test(s))return out.toISOString();
 return null
}
function split(t){
 return t.replace(/\n+/g,'. ')
 .split(/(?:[.!?]+\s+|;\s*|,\s+(?=(?:and\s+)?(?:buy|order|get|call|email|book|remember|remind|paint|make|finish|sort|send|print|find|look|research|idea|maybe)\b))/i)
 .map(x=>x.trim().replace(/^(?:and\s+)/i,'').replace(/[.!?]+$/,'')).filter(x=>x.length>2)
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(thoughts));render()}
function render(){const x=thoughts.at(-1), card=$('#dynamicCard');if(!x){card.className='hidden';return}card.className='';card.innerHTML=`<div class="moon">☾</div><div><div class="thoughtTitle">${esc(x.text)}</div><div class="meta">${esc(x.category)} · ${esc(x.type||'Note')} · ${new Date(x.created).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></div><input class="done" type="checkbox" ${x.done?'checked':''}>`;$('.done').onchange=e=>{x.done=e.target.checked;save()}}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1500)}
$('#dump').oninput=e=>$('#counter').textContent=`${e.target.value.length}/1000`;
$('#dumpBtn').onclick=()=>{const raw=$('#dump').value.trim();if(!raw)return toast('Give me some chaos first 😂');$('#sorting').classList.add('show');setTimeout(()=>{split(raw).forEach(text=>thoughts.push({id:(crypto.randomUUID?.()||Date.now()+Math.random()+''),text,category:cat(text),type:kind(text),due:when(text),created:Date.now(),done:false}));save();$('#dump').value='';$('#counter').textContent='0/1000';$('#sorting').classList.remove('show')},650)};
$('#speak').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice capture is unavailable here');const r=new SR();r.lang='en-GB';r.onresult=e=>{$('#dump').value+=($('#dump').value?' ':'')+e.results[0][0].transcript;$('#dump').dispatchEvent(new Event('input'))};r.start()};
function close(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'))}document.querySelectorAll('.back').forEach(b=>b.onclick=close);$('#home').onclick=close;
$('#today').onclick=()=>{close();$('#todayList').innerHTML=thoughts.length?thoughts.slice().reverse().map(t=>`<div class="item"><b>${esc(t.text)}</b><small>${esc(t.category)}</small></div>`).join(''):'<div class="item">Nothing dumped yet.</div>';$('#todayScreen').classList.add('show')};
$('#cats').onclick=()=>{close();const g={};thoughts.forEach(t=>(g[t.category]??=[]).push(t));$('#catList').innerHTML=Object.keys(g).length?Object.entries(g).map(([c,a])=>`<div class="item"><b>${esc(c)}</b><small>${a.length} thought${a.length===1?'':'s'}</small></div>`).join(''):'<div class="item">Your categories will appear here.</div>';$('#catsScreen').classList.add('show')};
$('#search').onclick=()=>{close();$('#searchScreen').classList.add('show');$('#searchBox').focus()};$('#searchBox').oninput=e=>{const q=e.target.value.toLowerCase(),a=q?thoughts.filter(t=>t.text.toLowerCase().includes(q)||t.category.toLowerCase().includes(q)):[];$('#searchList').innerHTML=a.map(t=>`<div class="item"><b>${esc(t.text)}</b><small>${esc(t.category)}</small></div>`).join('')};
render();
</script></body></html>
