<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d392c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Brain Dump</title>
<style>
:root{--paper:#f2e6cf;--paper2:#e7d4b4;--ink:#2d241e;--rust:#9c4f2f;--forest:#2d392c;--olive:#667057;--gold:#c39153;--cream:#fff8e9;--muted:#78695b;--shadow:0 12px 35px #2b20182b}*{box-sizing:border-box}body{margin:0;background:#251f1a;color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--paper);background-image:radial-gradient(#6f563614 .7px,transparent .7px),linear-gradient(105deg,#fff4 0 1px,transparent 1px);background-size:8px 8px,100% 100%;position:relative;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 88px);overflow:hidden}.app:before{content:"✦";position:absolute;font-size:150px;opacity:.035;right:-20px;top:120px}.brand{text-align:center;margin:8px 0 22px}.brand .kicker{font:700 11px/1 ui-sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--rust)}h1{font-family:Georgia,serif;font-size:46px;line-height:.9;margin:8px 0 8px;font-weight:500;letter-spacing:-.04em}.tag{font-family:Georgia,serif;font-style:italic;color:var(--muted);font-size:16px}.card{background:#fff9ecb8;border:1px solid #7d67452e;border-radius:24px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(5px)}.prompt{font-family:Georgia,serif;font-size:25px;line-height:1.05;margin:2px 0 13px}.input{width:100%;min-height:160px;border:1px solid #735b3d38;border-radius:17px;padding:15px;background:#f9efd9;color:var(--ink);font:17px/1.45 inherit;resize:none;outline:none}.input:focus{border-color:var(--rust);box-shadow:0 0 0 3px #9c4f2f18}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}.btn{border:0;border-radius:15px;padding:14px 12px;font-weight:800;letter-spacing:.04em}.speak{background:#d8c5a5;color:#46372d}.dump{background:var(--rust);color:#fff8e9;box-shadow:0 7px 16px #7b321e36}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:25px 4px 10px}.sectionTitle h2{font:500 24px Georgia,serif;margin:0}.sectionTitle span{font-size:12px;color:var(--muted)}.thoughts{display:grid;gap:10px}.thought{background:#f9efd9;border:1px solid #725f4130;border-radius:18px;padding:13px 14px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:start}.icon{width:42px;height:42px;border-radius:13px;background:var(--forest);display:grid;place-items:center;color:white;font-size:19px}.thought h3{font-size:15px;margin:1px 0 5px;line-height:1.25}.meta{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.done{appearance:none;width:24px;height:24px;border:1.5px solid #806e5a;border-radius:50%;background:transparent;margin-top:8px}.done:checked{background:var(--forest);box-shadow:inset 0 0 0 5px var(--paper)}.empty{text-align:center;color:var(--muted);padding:24px 10px;font:italic 15px Georgia,serif}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:9px 18px calc(env(safe-area-inset-bottom) + 9px);background:#2d392cf2;color:#f4ead6;display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.nav button{border:0;background:none;color:inherit;opacity:.7;font-size:11px;padding:5px}.nav button b{display:block;font-size:20px;margin-bottom:2px}.nav .active{opacity:1}.sorting{position:fixed;inset:0;background:var(--forest);z-index:10;color:#f3e6cf;display:none;place-items:center;text-align:center}.sorting.show{display:grid}.sorting .moon{font-size:54px;animation:pulse 1s infinite alternate}.sorting h2{font:italic 31px Georgia,serif;margin:14px 0 5px}.sorting p{opacity:.72}@keyframes pulse{to{transform:scale(1.12) rotate(5deg);opacity:.65}}.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-20px);background:#2d392c;color:white;padding:10px 15px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><main class="app"><header class="brand"><div class="kicker">✦ a quiet place for loud thoughts ✦</div><h1>brain dump</h1><div class="tag">get it out of your head.</div></header><section class="card"><div class="prompt">What’s rattling around in there?</div><textarea id="dump" class="input" placeholder="dump absolutely anything…\n\nThings to do, buy, remember, make, research — no organising required."></textarea><div class="actions"><button class="btn speak" id="speak">◉ Speak</button><button class="btn dump" id="dumpBtn">DUMP IT ✦</button></div></section><div class="sectionTitle"><h2>recent chaos</h2><span id="count">0 thoughts</span></div><section id="thoughts" class="thoughts"></section></main><nav class="nav"><button class="active"><b>☾</b>Dump</button><button id="cats"><b>✦</b>Categories</button><button id="search"><b>⌕</b>Search</button></nav><div class="sorting" id="sorting"><div><div class="moon">☾ ✦</div><h2>sorting the chaos…</h2><p>untangling one thought at a time</p></div></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s), KEY='brain-dump-v1'; let thoughts=JSON.parse(localStorage.getItem(KEY)||'[]');
const cats=[['Mischievous Melts',/wax|melt|scent|fragrance|clp|mould|mold|shopify|etsy/i,'✦'],['Oscar',/oscar|dog|flea|treat/i,'🐾'],['Shopping',/buy|order|pick up|shopping|need more|get some/i,'⌑'],['Home & DIY',/paint|cabinet|trim|wall|shelf|radiator|wood|diy|room|garden|sand|drill/i,'⌂'],['Learning / Research',/look into|research|course|find out|learn/i,'⌕'],['Life Admin',/book|appointment|email|call|pay|renew|form/i,'☷'],['Personal',/mam|gary|birthday|card|personal/i,'♡'],['Ideas',/idea|maybe|could|what if/i,'☼']];
function classify(t){for(const [name,re,icon] of cats)if(re.test(t))return{name,icon};return{name:'Inbox',icon:'☾'}}
function splitDump(t){return t.replace(/\n+/g,'. ').split(/(?:[.!?]+\s+|;\s*|,\s+(?=(?:need|order|remember|idea|look|buy|call|email|finish|make|find)\b))/i).map(x=>x.trim().replace(/[.!?]+$/,'')).filter(x=>x.length>2)}
function save(){localStorage.setItem(KEY,JSON.stringify(thoughts));render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(list=thoughts){$('#count').textContent=`${thoughts.length} thought${thoughts.length===1?'':'s'}`;$('#thoughts').innerHTML=list.length?list.slice().reverse().map(x=>`<article class="thought"><div class="icon">${x.icon}</div><div><h3>${esc(x.text)}</h3><div class="meta">${x.category} · ${new Date(x.created).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></div><input class="done" type="checkbox" data-id="${x.id}" ${x.done?'checked':''}></article>`).join(''):`<div class="empty">Nothing here yet. Your brain is suspiciously quiet. ✦</div>`;document.querySelectorAll('.done').forEach(e=>e.onchange=()=>{let x=thoughts.find(t=>t.id===e.dataset.id);x.done=e.checked;save()})}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
$('#dumpBtn').onclick=()=>{let raw=$('#dump').value.trim();if(!raw)return toast('Give me some chaos first 😂');$('#sorting').classList.add('show');setTimeout(()=>{splitDump(raw).forEach(text=>{let c=classify(text);thoughts.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()+'',text,category:c.name,icon:c.icon,created:Date.now(),done:false})});save();$('#dump').value='';$('#sorting').classList.remove('show');toast('Chaos contained ✦')},900)};
$('#speak').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice capture needs Safari support');let r=new SR();r.lang='en-GB';r.interimResults=false;r.onstart=()=>toast('Listening…');r.onresult=e=>{$('#dump').value+=($('#dump').value?' ':'')+e.results[0][0].transcript};r.start()};
$('#cats').onclick=()=>{let names=[...new Set(thoughts.map(t=>t.category))];toast(names.length?names.join(' · '):'Categories appear after your first dump')};$('#search').onclick=()=>{let q=prompt('Search your brain:');if(q!==null)render(thoughts.filter(t=>t.text.toLowerCase().includes(q.toLowerCase())||t.category.toLowerCase().includes(q.toLowerCase())))};render();
</script></body></html>
